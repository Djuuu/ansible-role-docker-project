---

- name: "Update project: {{ docker_project_name }}"
  when: docker_compose_cli is not truthy
  vars:
    restart: "{{ docker_project_restart is truthy and docker_project_restart != 'no' }}"
  block:

    - name: "Update project images: {{ docker_project_name }}"
      community.docker.docker_compose_v2_pull:
        docker_cli:  "{{ docker_cli | default(omit, true) }}"
        project_src: "{{ docker_project_path }}"
      register: pull_output
      when: not restart

    - name: "Update project services: {{ docker_project_name }}"
      when: restart
      block:

        - name: "Update project services: {{ docker_project_name }}"
          community.docker.docker_compose_v2:
            docker_cli:     "{{ docker_cli | default(omit, true) }}"
            project_src:    "{{ docker_project_path }}"
            pull:           always
            state:          present
            remove_orphans: true
            wait:           "{{ restart }}"
          register: output

        - name: "Show project update status: {{ docker_project_name }}"
          ansible.builtin.debug:
            msg: "{{ output.stderr_lines | default([]) }}"
          changed_when: output.changed

        - name: "Show status: {{ docker_project_name }}"
          ansible.builtin.include_tasks: compose-ps.yml


- name: "Update project (legacy): {{ docker_project_name }}"
  when: docker_compose_cli is truthy
  vars:
    restart: "{{ docker_project_restart is truthy and docker_project_restart != 'no' }}"
    pull_match_lines: '.* (Pulling|Pulled|No image to be pulled)\s*$'
  block:

    - name: "Pull project images: {{ docker_project_name }}"
      block:
        - name: "Pull project images: {{ docker_project_name }}"
          ansible.builtin.command: "{{ docker_compose_cmd }} pull"
          args:
            chdir: "{{ docker_project_path }}"
          register: legacy_pull_output
          changed_when: |
            (legacy_pull_output.stderr_lines | length) >
            (legacy_pull_output.stderr_lines | select('match', pull_match_lines) | length)
          ignore_errors: true

        - name: "Show project pull result: {{ docker_project_name }}"
          ansible.builtin.debug:
            msg: "{{ legacy_pull_output.stderr_lines | select('match', pull_match_lines) }}"
          changed_when: legacy_pull_output.changed

    - name: "Update project services: {{ docker_project_name }}"
      when: restart
      block:
        - name: "Start project containers: {{ docker_project_name }}"
          ansible.builtin.command: "{{ docker_compose_cmd }} up --quiet-pull -d"
          args:
            chdir: "{{ docker_project_path }}"
          register: legacy_output
          changed_when: legacy_output.stderr_lines | select('match', '.* Starting') | length > 0
          ignore_errors: true

        - name: "Show project start result: {{ docker_project_name }}"
          ansible.builtin.debug:
            msg: "{{ legacy_output.stderr_lines }}"
          changed_when: legacy_output.changed

        - name: "Show project status: {{ docker_project_name }}"
          ansible.builtin.include_tasks: compose-ps.yml


- name: "Register updated project: {{ docker_project_name }}"
  ansible.builtin.set_fact:
    docker_projects_updated: "{{ docker_projects_updated | default([]) + [docker_project_name] }}"
  when: >-
    pull_output | default({}) is changed
    or output | default({}) is changed
    or legacy_pull_output | default({}) is changed
    or legacy_output | default({}) is changed
